<title>마음속 사전</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#EEF3F1;
    --surface:#FFFFFF;
    --surface-2:#E4ECE9;
    --ink:#1B2624;
    --ink-soft:#4B5C58;
    --line:#D3DEDA;
    --teal:#0F6E63;
    --teal-soft:#E3F0EC;
    --amber:#A3661F;
    --amber-soft:#F7ECDA;
    --plum:#6E4A8E;
    --plum-soft:#EEE6F4;
    --on-accent:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1B18;
      --surface:#16241F;
      --surface-2:#1C2C27;
      --ink:#EAF2EF;
      --ink-soft:#A9BDB7;
      --line:#2A3B35;
      --teal:#5FCDB8;
      --teal-soft:#1B3630;
      --amber:#E3A75B;
      --amber-soft:#332711;
      --plum:#C9A6E8;
      --plum-soft:#2A2036;
      --on-accent:#0F1B18;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1B18;
    --surface:#16241F;
    --surface-2:#1C2C27;
    --ink:#EAF2EF;
    --ink-soft:#A9BDB7;
    --line:#2A3B35;
    --teal:#5FCDB8;
    --teal-soft:#1B3630;
    --amber:#E3A75B;
    --amber-soft:#332711;
    --plum:#C9A6E8;
    --plum-soft:#2A2036;
    --on-accent:#0F1B18;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, sans-serif;
    line-height:1.7;
  }
  .wrap{max-width:760px; margin:0 auto; padding:56px 24px 96px;}

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--teal);
  }
  h1{
    font-family:'Gowun Batang', serif;
    font-size:clamp(30px, 5vw, 40px);
    font-weight:700;
    margin:10px 0 12px;
    text-wrap:balance;
  }
  .lede{
    font-size:16px;
    color:var(--ink-soft);
    max-width:56ch;
    margin:0 0 28px;
  }

  /* search */
  .searchbar{
    position:sticky;
    top:0;
    z-index:5;
    background:var(--bg);
    padding:14px 0;
    margin:0 0 6px;
    border-bottom:1px solid var(--line);
  }
  .searchbar input{
    width:100%;
    font-family:'Noto Sans KR', sans-serif;
    font-size:16px;
    padding:13px 16px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    outline:none;
  }
  .searchbar input:focus{ border-color:var(--teal); }
  .count{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:10px 2px 0;
  }

  /* filter chips */
  .chips{ display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 4px; }
  .chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.04em;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip:hover{ background:var(--surface-2); color:var(--ink); }
  .chip.active{ background:var(--teal); border-color:var(--teal); color:var(--on-accent); }

  /* cards */
  .list{ margin-top:22px; display:flex; flex-direction:column; gap:12px; }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px;
  }
  .card-head{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .term{
    font-family:'Gowun Batang', serif;
    font-size:19px;
    font-weight:700;
    color:var(--ink);
  }
  .alias{ font-size:13px; color:var(--ink-soft); }
  .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:999px;
    display:inline-block;
    margin-left:auto;
    white-space:nowrap;
  }
  .tag.dx{ background:var(--teal-soft); color:var(--teal); }
  .tag.abbr{ background:var(--amber-soft); color:var(--amber); }
  .tag.tool{ background:var(--plum-soft); color:var(--plum); }
  .explain{ font-size:14.5px; color:var(--ink); margin:0 0 10px; }
  .source{
    font-size:12px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    padding-top:8px;
    margin-top:2px;
  }
  .source b{ color:var(--ink-soft); font-weight:600; }
  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:48px 0;
  }

  .disclaimer{
    margin-top:36px;
    background:var(--teal-soft);
    border-radius:14px;
    padding:18px 22px;
    font-size:13.5px;
    color:var(--ink);
  }
  .disclaimer b{ color:var(--teal); }
</style>

<div class="wrap">
  <div class="eyebrow">Mental Health Glossary</div>
  <h1>마음속 사전</h1>
  <p class="lede">정신건강 관련 약어와 용어를 검색하면, 쉬운 말과 함께 참고 출처를 보여드려요.</p>

  <div class="searchbar">
    <input id="search" type="text" placeholder="예: PTSD, 공황장애, PHQ-9, F/U ..." autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>검색 결과가 없어요. 다른 표기(약어/한글명)로 시도해보세요.</div>

  <div class="disclaimer">
    <b>안내</b> · 이 사전은 임상 현장에서 통용되는 정의를 이해하기 쉽게 정리한 참고 자료로, 진단이나 처방을 대신하지 않아요. 정확한 진단·치료 기준은 담당 의료진 또는 아래 출처 문헌을 확인해주세요.
  </div>
</div>

<script>
const TERMS = [
  {term:"ADHD", alias:"주의력결핍 과잉행동장애", cat:"dx", explain:"집중을 유지하기 어렵거나, 가만히 있기 힘들고 충동적인 행동이 반복되는 신경발달장애예요. 아동기에 흔히 발견되지만 성인까지 이어지기도 해요.", source:"DSM-5-TR(APA) · 국가정신건강정보포털"},
  {term:"ASD", alias:"자폐스펙트럼장애", cat:"dx", explain:"사회적 의사소통의 어려움과 반복적 행동·관심사가 특징인 신경발달장애로, 증상의 정도가 사람마다 매우 다양해서 '스펙트럼'이라고 불러요.", source:"DSM-5-TR(APA) · ICD-11(WHO)"},
  {term:"ODD", alias:"적대적 반항장애", cat:"dx", explain:"어른이나 권위자에게 자주 화내고 짜증내며 반항적·적대적 태도를 반복적으로 보이는 상태예요.", source:"DSM-5-TR(APA)"},
  {term:"MDD", alias:"주요우울장애", cat:"dx", explain:"우울한 기분이나 흥미 상실이 2주 이상 지속되며 일상 기능에 지장을 주는 상태를 말해요. 흔히 '우울증'이라고 부르는 것이 이에 해당해요.", source:"DSM-5-TR(APA)"},
  {term:"GAD", alias:"범불안장애", cat:"dx", explain:"특정한 대상 없이 여러 일에 대해 지나치게 걱정하는 상태가 6개월 이상 지속되는 불안장애예요.", source:"DSM-5-TR(APA)"},
  {term:"SAD", alias:"사회불안장애", cat:"dx", explain:"다른 사람 앞에서 평가받거나 창피당할까봐 사회적 상황을 심하게 두려워하고 피하는 상태예요.", source:"DSM-5-TR(APA)"},
  {term:"PTSD", alias:"외상 후 스트레스 장애", cat:"dx", explain:"생명을 위협하는 사건이나 큰 충격을 겪은 뒤 그 기억이 반복적으로 떠오르고(플래시백), 관련 자극을 피하며, 과도하게 경계하는 상태가 지속되는 것이에요.", source:"DSM-5-TR(APA) · ICD-11(WHO)"},
  {term:"OCD", alias:"강박장애", cat:"dx", explain:"원치 않는 생각(강박사고)이 반복되고, 이를 없애려 특정 행동(강박행동)을 반복하게 되는 상태예요.", source:"DSM-5-TR(APA)"},
  {term:"BPD", alias:"경계선 성격장애", cat:"dx", explain:"감정 기복이 크고 대인관계가 불안정하며, 버림받는 것에 대한 두려움이 강하게 나타나는 성격장애의 한 유형이에요.", source:"DSM-5-TR(APA)"},
  {term:"Panic Disorder", alias:"공황장애", cat:"dx", explain:"별다른 이유 없이 갑작스럽게 심장이 뛰고 숨이 막히는 등 극심한 공포(공황발작)가 반복되고, 또 발작이 올까봐 계속 불안해하는 상태예요.", source:"DSM-5-TR(APA)"},
  {term:"Bipolar Disorder", alias:"양극성 장애(조울증)", cat:"dx", explain:"기분이 들뜨고 에너지가 넘치는 조증(또는 경조증) 시기와, 우울한 시기가 번갈아 나타나는 기분장애예요.", source:"DSM-5-TR(APA)"},
  {term:"NSSI", alias:"비자살적 자해", cat:"abbr", explain:"죽으려는 의도 없이 스스로 신체에 상처를 내는 행동을 말해요. 감당하기 힘든 감정을 다루려는 시도인 경우가 많아 전문적 개입이 필요해요.", source:"DSM-5-TR(APA)"},
  {term:"SI", alias:"자살사고", cat:"abbr", explain:"죽고 싶다는 생각이 드는 것을 뜻해요. 실제 행동(자살시도, SA)으로 이어지는지와 별개로, SI 자체만으로도 상담·평가가 필요한 신호예요.", source:"임상 현장 통용 약어"},
  {term:"SA", alias:"자살시도", cat:"abbr", explain:"실제로 스스로를 해치려는 행동을 시도한 경우를 가리키는 약어예요.", source:"임상 현장 통용 약어"},
  {term:"Adjustment Disorder", alias:"적응장애", cat:"dx", explain:"이사, 전학, 이별 등 뚜렷한 스트레스 사건 이후 3개월 이내에 그 사건에 비해 유독 힘든 정서적·행동적 반응이 나타나는 상태예요.", source:"DSM-5-TR(APA)"},
  {term:"Selective Mutism", alias:"선택적 함구증", cat:"dx", explain:"집 등 편한 곳에서는 말을 잘 하지만, 학교처럼 특정 상황에서는 말을 하지 못하는 불안 관련 장애예요.", source:"DSM-5-TR(APA)"},
  {term:"School Refusal", alias:"등교거부/학교거부", cat:"abbr", explain:"불안이나 정서적 어려움 때문에 학교 가는 것 자체를 강하게 힘들어하거나 거부하는 상태를 가리키는 용어예요. 무단결석과 달리 정서적 고통이 핵심이에요.", source:"임상·교육 현장 통용 용어"},
  {term:"F/U", alias:"추적관찰 (Follow-up)", cat:"abbr", explain:"치료나 상담 후 경과를 지켜보기 위해 다시 만나거나 확인하는 것을 뜻해요.", source:"임상 차트 통용 약어"},
  {term:"R/O", alias:"배제진단 (Rule Out)", cat:"abbr", explain:"'~일 가능성을 배제하기 위해 검토 중'이라는 뜻으로, 아직 확진은 아니지만 해당 진단 가능성을 살펴보고 있다는 의미예요.", source:"임상 차트 통용 약어"},
  {term:"Dx", alias:"진단 (Diagnosis)", cat:"abbr", explain:"진단명이나 진단 자체를 줄여 쓴 표현이에요.", source:"임상 차트 통용 약어"},
  {term:"Sx", alias:"증상 (Symptom)", cat:"abbr", explain:"환자·내담자가 보이는 증상을 줄여 쓴 표현이에요.", source:"임상 차트 통용 약어"},
  {term:"Tx", alias:"치료 (Treatment)", cat:"abbr", explain:"치료 계획이나 치료 자체를 줄여 쓴 표현이에요.", source:"임상 차트 통용 약어"},
  {term:"Hx", alias:"병력 (History)", cat:"abbr", explain:"과거의 병력이나 상담 이력을 줄여 쓴 표현이에요.", source:"임상 차트 통용 약어"},
  {term:"PHQ-9", alias:"우울증 선별 척도", cat:"tool", explain:"지난 2주간의 우울 증상 9가지를 스스로 체크해 우울 정도를 가늠해보는 자기보고식 설문이에요. 진단이 아니라 선별(스크리닝) 도구예요.", source:"Kroenke et al., 2001 · 국가정신건강정보포털"},
  {term:"GAD-7", alias:"불안 선별 척도", cat:"tool", explain:"지난 2주간의 불안 증상 7가지를 체크해 불안 수준을 가늠해보는 자기보고식 선별 도구예요.", source:"Spitzer et al., 2006"},
  {term:"K-CBCL", alias:"아동청소년 행동평가척도(한국판)", cat:"tool", explain:"부모나 교사가 아이의 정서·행동 문제를 평가하는 대표적인 검사도구예요.", source:"Achenbach 체계(ASEBA) 한국판"},
  {term:"WISC", alias:"아동용 웩슬러 지능검사", cat:"tool", explain:"아동의 지능(인지능력)을 여러 하위영역으로 나누어 평가하는 대표적인 개인지능검사예요.", source:"Wechsler 지능검사 체계"},
  {term:"MMPI", alias:"다면적 인성검사", cat:"tool", explain:"성격 특성과 정서적 어려움을 폭넓게 파악하기 위해 널리 쓰이는 자기보고식 성격검사예요.", source:"Minnesota Multiphasic Personality Inventory"},
  {term:"CBT", alias:"인지행동치료", cat:"tool", explain:"생각(인지)과 행동의 패턴을 함께 다뤄, 부정적인 사고방식과 행동 습관을 바꿔가는 대표적인 심리치료 기법이에요.", source:"Beck 인지치료 이론"},
  {term:"DBT", alias:"변증법적 행동치료", cat:"tool", explain:"감정 조절과 대인관계 기술을 훈련하는 치료법으로, 특히 자해·경계선 성격장애 치료에 많이 활용돼요.", source:"Linehan, DBT 이론"},
  {term:"EMDR", alias:"안구운동 민감소실 및 재처리요법", cat:"tool", explain:"눈동자를 좌우로 움직이는 등 양측성 자극을 활용해 외상 기억을 재처리하도록 돕는 트라우마 치료 기법이에요.", source:"Shapiro, EMDR 이론"},
  {term:"IEP", alias:"개별화교육계획", cat:"abbr", explain:"특수교육대상 학생 개개인의 필요에 맞춰 세우는 맞춤형 교육 계획을 말해요.", source:"교육부 특수교육 운영 지침"},
  {term:"Wee클래스", alias:"학교 안 상담실", cat:"abbr", explain:"학생들의 정서·행동상 어려움을 학교 안에서 바로 상담받을 수 있도록 마련된 상담공간·제도예요.", source:"교육부 Wee프로젝트"},
  {term:"경계선 지능", alias:"Borderline Intellectual Functioning", cat:"abbr", explain:"지적장애만큼은 아니지만 평균보다 지능이 낮아(대략 IQ 71~84) 학습이나 적응에 어려움을 겪는 상태를 가리키는 용어예요.", source:"임상·교육 현장 통용 용어"},
];

const CATS = [
  {key:"all", label:"전체"},
  {key:"dx", label:"진단명"},
  {key:"abbr", label:"약어·용어"},
  {key:"tool", label:"검사·치료기법"},
];

let activeCat = "all";

function renderChips(){
  const el = document.getElementById('chips');
  el.innerHTML = CATS.map(c =>
    `<button class="chip ${c.key===activeCat?'active':''}" data-cat="${c.key}">${c.label}</button>`
  ).join('');
  el.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCat = btn.dataset.cat;
      renderChips();
      renderList();
    });
  });
}

function renderList(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');

  const filtered = TERMS.filter(t=>{
    const matchCat = activeCat==="all" || t.cat===activeCat;
    const hay = (t.term + " " + t.alias).toLowerCase();
    const matchQ = q==="" || hay.includes(q);
    return matchCat && matchQ;
  });

  count.textContent = q ? `${filtered.length}개 결과` : `총 ${TERMS.length}개 용어`;

  if(filtered.length === 0){
    list.innerHTML = "";
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  const tagLabel = {dx:"진단명", abbr:"약어·용어", tool:"검사·기법"};

  list.innerHTML = filtered.map(t => `
    <div class="card">
      <div class="card-head">
        <span class="term">${t.term}</span>
        <span class="alias">${t.alias}</span>
        <span class="tag ${t.cat}">${tagLabel[t.cat]}</span>
      </div>
      <p class="explain">${t.explain}</p>
      <div class="source"><b>출처</b> · ${t.source}</div>
    </div>
  `).join('');
}

document.getElementById('search').addEventListener('input', renderList);
