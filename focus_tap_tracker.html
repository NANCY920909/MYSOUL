<title>집중력 킵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF8EC;
    --bg-soft: #FFF1DD;
    --surface: #FFFFFF;
    --ink: #2D4A2F;
    --ink-soft: #6C7B6A;
    --pink: #FF9FBB;
    --pink-deep: #F2748F;
    --green: #7BC47F;
    --green-deep: #4F9457;
    --yellow: #FFD873;
    --line: #ECE3CF;
    --shadow: rgba(45, 74, 47, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16211A;
      --bg-soft: #1C2A20;
      --surface: #22301F;
      --ink: #F0F1E4;
      --ink-soft: #B7C3AF;
      --pink: #FF9FBB;
      --pink-deep: #FFB3C9;
      --green: #8FD08F;
      --green-deep: #A9E0A9;
      --yellow: #FFD873;
      --line: #35443A;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16211A;
    --bg-soft: #1C2A20;
    --surface: #22301F;
    --ink: #F0F1E4;
    --ink-soft: #B7C3AF;
    --pink: #FF9FBB;
    --pink-deep: #FFB3C9;
    --green: #8FD08F;
    --green-deep: #A9E0A9;
    --yellow: #FFD873;
    --line: #35443A;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--bg-soft), var(--bg) 40%);
    color: var(--ink);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px 40px;
  }
  .page { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 18px; }

  .header { text-align: center; display: flex; flex-direction: column; gap: 2px; position: relative; }
  .eyebrow {
    font-size: 13px; color: var(--ink-soft); letter-spacing: 0.04em;
  }
  h1 {
    font-family: "Jua", "Noto Sans KR", sans-serif;
    font-weight: 400;
    font-size: 30px;
    margin: 0;
    color: var(--ink);
    text-wrap: balance;
  }
  .whoami {
    font-size: 12.5px; color: var(--ink-soft);
    background: none; border: none; text-decoration: underline; cursor: pointer;
    margin-top: 2px;
  }

  .gate-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; text-align: center;
  }
  .gate-card p { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
  .gate-row { display: flex; gap: 8px; }
  .gate-row input {
    flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    font-family: "Noto Sans KR", sans-serif; font-size: 14px;
  }
  .gate-row button {
    padding: 10px 16px; border-radius: 12px; border: none;
    background: var(--pink-deep); color: #fff; font-weight: 500; font-size: 14px; cursor: pointer;
    white-space: nowrap;
  }

  .tap-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .tap-btn {
    width: 190px; height: 190px; border-radius: 50%;
    border: none; background: transparent; cursor: pointer;
    padding: 0; position: relative;
    filter: drop-shadow(0 10px 18px var(--shadow));
    animation: float 3.2s ease-in-out infinite;
  }
  .tap-btn:active { transform: scale(0.94); }
  .tap-btn.bounce { animation: bounce 0.42s ease; }
  .tap-btn:disabled { opacity: 0.45; cursor: not-allowed; animation: none; }
  .tap-btn svg { width: 100%; height: 100%; display: block; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes bounce {
    0% { transform: scale(1); }
    35% { transform: scale(0.88); }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tap-btn { animation: none; }
    .tap-btn.bounce { animation: none; }
  }
  .tap-hint { font-size: 13px; color: var(--ink-soft); }
  .undo-btn {
    background: none; border: none; color: var(--ink-soft);
    font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px;
  }

  .status-pill {
    align-self: center;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 18px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
    font-size: 14px; font-weight: 500;
  }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green-deep); flex: none; }
  .status-pill[data-level="mid"] .status-dot { background: var(--yellow); }
  .status-pill[data-level="high"] .status-dot { background: var(--pink-deep); }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat-tile {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 8px; text-align: center; display: flex; flex-direction: column; gap: 4px;
  }
  .stat-value {
    font-family: "Jua", sans-serif; font-size: 26px; font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .stat-label { font-size: 11.5px; color: var(--ink-soft); }

  .since-line { text-align: center; font-size: 13.5px; color: var(--ink-soft); }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px 14px 10px;
  }
  .card-title { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 6px 2px; display: flex; justify-content: space-between; align-items: baseline; }
  .card-title .hint { font-size: 11px; }
  .chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart-axis { stroke: var(--line); stroke-width: 1; }
  .chart-val { font-size: 9px; fill: var(--ink-soft); font-family: "Noto Sans KR", sans-serif; }
  .chart-label { font-size: 9px; fill: var(--ink-soft); font-family: "Noto Sans KR", sans-serif; }

  .board-list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
  .board-row {
    display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px;
    padding: 8px 2px;
  }
  .board-row.me { background: var(--bg-soft); border-radius: 10px; padding: 8px 8px; }
  .board-rank { font-size: 13px; color: var(--ink-soft); text-align: center; font-variant-numeric: tabular-nums; }
  .board-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .board-name { font-size: 13.5px; display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board-bar-track { height: 6px; border-radius: 999px; background: var(--bg-soft); overflow: hidden; }
  .board-bar-fill { height: 100%; border-radius: 999px; background: var(--pink); }
  .board-count { font-family: "Jua", sans-serif; font-size: 17px; font-variant-numeric: tabular-nums; padding-left: 4px; }
  .board-empty { text-align: center; font-size: 13px; color: var(--ink-soft); padding: 10px 0; }

  .footer { text-align: center; font-size: 11.5px; color: var(--ink-soft); }
</style>

<div class="page">
  <div class="header">
    <div class="eyebrow">산만함 잡아주는</div>
    <h1>집중력 킵</h1>
    <button class="whoami" id="whoamiBtn" hidden>나: <span id="whoamiName"></span> · 닉네임 바꾸기</button>
  </div>

  <div class="gate-card" id="nameGate">
    <p>친구들과 함께 쓰려면 먼저 닉네임을 정해주세요</p>
    <div class="gate-row">
      <input id="nameInput" type="text" maxlength="12" placeholder="예: 당근이" />
      <button id="nameSubmit">시작하기</button>
    </div>
  </div>

  <div class="tap-wrap">
    <button class="tap-btn" id="tapBtn" aria-label="산만함을 느낄 때 당복이를 탭하세요" disabled>
      <svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="55" cy="48" rx="32" ry="36" fill="var(--pink)"></ellipse>
        <ellipse cx="145" cy="48" rx="32" ry="36" fill="var(--pink)"></ellipse>
        <ellipse cx="60" cy="58" rx="15" ry="20" fill="var(--pink-deep)"></ellipse>
        <ellipse cx="140" cy="58" rx="15" ry="20" fill="var(--pink-deep)"></ellipse>
        <circle cx="100" cy="105" r="82" fill="var(--pink)"></circle>
        <path d="M100,75 C89,54 53,59 53,95 C53,127 79,148 100,164 C121,148 147,127 147,95 C147,59 111,54 100,75 Z" fill="var(--surface)"></path>
        <ellipse cx="80" cy="103" rx="7.5" ry="9.5" fill="var(--ink)"></ellipse>
        <ellipse cx="120" cy="103" rx="7.5" ry="9.5" fill="var(--ink)"></ellipse>
        <ellipse cx="65" cy="117" rx="11" ry="6.5" fill="var(--pink-deep)" opacity="0.55"></ellipse>
        <ellipse cx="135" cy="117" rx="11" ry="6.5" fill="var(--pink-deep)" opacity="0.55"></ellipse>
        <path d="M89,128 Q100,139 111,128" stroke="var(--pink-deep)" stroke-width="4.5" fill="none" stroke-linecap="round"></path>
      </svg>
    </button>
    <div class="tap-hint" id="tapHint">닉네임을 먼저 정해주세요 ↑</div>
    <button class="undo-btn" id="undoBtn">방금 탭 되돌리기</button>
  </div>

  <div class="status-pill" id="statusPill" data-level="calm">
    <span class="status-dot"></span>
    <span id="statusText">기록을 불러오는 중…</span>
  </div>

  <div class="stats-row">
    <div class="stat-tile">
      <div class="stat-value" id="todayCount">0</div>
      <div class="stat-label">오늘 탭</div>
    </div>
    <div class="stat-tile">
      <div class="stat-value" id="hourCount">0</div>
      <div class="stat-label">최근 1시간</div>
    </div>
    <div class="stat-tile">
      <div class="stat-value" id="totalCount">0</div>
      <div class="stat-label">누적 탭</div>
    </div>
  </div>

  <div class="since-line" id="sinceText">아직 탭 기록이 없어요</div>

  <div class="card">
    <p class="card-title">오늘, 우리 중 누가 제일 차분할까<span class="hint">적을수록 집중</span></p>
    <div class="board-list" id="board">
      <div class="board-empty">아직 아무도 탭하지 않았어요</div>
    </div>
  </div>

  <div class="card">
    <p class="card-title">내 최근 12시간 산만 패턴</p>
    <div class="chart-wrap">
      <svg id="chart" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <div class="footer">이 링크를 친구에게 공유하면 같은 판에서 함께 기록돼요</div>
</div>

<script>
(function () {
  const els = {
    nameGate: document.getElementById('nameGate'),
    nameInput: document.getElementById('nameInput'),
    nameSubmit: document.getElementById('nameSubmit'),
    whoamiBtn: document.getElementById('whoamiBtn'),
    whoamiName: document.getElementById('whoamiName'),
    tapBtn: document.getElementById('tapBtn'),
    tapHint: document.getElementById('tapHint'),
    undoBtn: document.getElementById('undoBtn'),
    statusPill: document.getElementById('statusPill'),
    statusText: document.getElementById('statusText'),
    todayCount: document.getElementById('todayCount'),
    hourCount: document.getElementById('hourCount'),
    totalCount: document.getElementById('totalCount'),
    sinceText: document.getElementById('sinceText'),
    chart: document.getElementById('chart'),
    board: document.getElementById('board'),
  };

  const ID_KEY = 'focusMemberId_v1';
  const NAME_KEY = 'focusMemberName_v1';
  const LOCAL_STATE_KEY = 'focusTapStats_v2';

  let memberId = null;
  let memberName = null;
  let state = { recent: [], hourly: {}, total: 0 };
  let docRef = null;
  let membersCol = null;
  let usingDb = false;
  let members = {}; // id -> {name, recent, total, ...}

  function pad(n) { return n.toString().padStart(2, '0'); }
  function hourKey(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours());
  }
  function dateKey(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function parseHourKey(k) {
    const m = /^(\d{4})-(\d{2})-(\d{2})T(\d{2})$/.exec(k);
    if (!m) return NaN;
    return new Date(+m[1], +m[2] - 1, +m[3], +m[4]).getTime();
  }
  function genId() {
    try { return crypto.randomUUID(); } catch (e) {
      return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }
  }
  function todayCountOf(recent) {
    const today = dateKey(new Date());
    return (recent || []).filter(t => dateKey(new Date(t)) === today).length;
  }

  function pruneState(s) {
    const now = Date.now();
    const weekAgo = now - 7 * 24 * 3600 * 1000;
    const recent = (s.recent || []).filter(t => typeof t === 'number' && t > weekAgo).slice(-200);
    const hourly = {};
    const cutoff = now - 48 * 3600 * 1000;
    Object.keys(s.hourly || {}).forEach(k => {
      const t = parseHourKey(k);
      if (!isNaN(t) && t > cutoff) hourly[k] = s.hourly[k];
    });
    return { name: s.name || memberName || '익명', recent, hourly, total: s.total || 0 };
  }

  function loadLocal() {
    try {
      const raw = localStorage.getItem(LOCAL_STATE_KEY);
      if (raw) return pruneState(JSON.parse(raw));
    } catch (e) {}
    return { recent: [], hourly: {}, total: 0 };
  }
  function saveLocal() {
    try { localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function renderBoard() {
    const rows = Object.keys(members).map(id => {
      const m = members[id];
      const tc = todayCountOf(m.recent);
      return { id, name: m.name || '익명', count: tc };
    });
    if (memberId && !(memberId in members)) {
      rows.push({ id: memberId, name: memberName || '나', count: todayCountOf(state.recent) });
    }
    if (!rows.length) {
      els.board.innerHTML = '<div class="board-empty">아직 아무도 탭하지 않았어요</div>';
      return;
    }
    rows.sort((a, b) => a.count - b.count);
    const max = Math.max(1, ...rows.map(r => r.count));
    let html = '';
    rows.forEach((r, i) => {
      const isMe = r.id === memberId;
      const crown = (i === 0 && r.count === 0 || i === 0) ? '👑' : (i === rows.length - 1 && rows.length > 1 && r.count > 0 ? '🔥' : '');
      const pct = Math.max(4, Math.round((r.count / max) * 100));
      html += '<div class="board-row' + (isMe ? ' me' : '') + '">'
        + '<div class="board-rank">' + (i + 1) + '</div>'
        + '<div class="board-main">'
        + '<div class="board-name">' + (crown ? crown + ' ' : '') + escapeHtml(r.name) + (isMe ? ' (나)' : '') + '</div>'
        + '<div class="board-bar-track"><div class="board-bar-fill" style="width:' + pct + '%"></div></div>'
        + '</div>'
        + '<div class="board-count">' + r.count + '</div>'
        + '</div>';
    });
    els.board.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function render() {
    const now = Date.now();
    const todayCount = todayCountOf(state.recent);
    const hourCount = state.recent.filter(t => now - t < 3600 * 1000).length;

    els.todayCount.textContent = todayCount;
    els.hourCount.textContent = hourCount;
    els.totalCount.textContent = state.total;

    let label, level;
    if (hourCount <= 1) { label = '차분하게 집중 중이에요'; level = 'calm'; }
    else if (hourCount <= 4) { label = '살짝 산만해요'; level = 'mid'; }
    else { label = '많이 산만해요, 잠깐 쉬어갈까요?'; level = 'high'; }
    els.statusText.textContent = label;
    els.statusPill.dataset.level = level;

    const last = state.recent[state.recent.length - 1];
    if (!last) {
      els.sinceText.textContent = memberId ? '아직 탭 기록이 없어요' : '닉네임을 정하면 기록이 시작돼요';
    } else {
      const secs = Math.max(0, Math.floor((now - last) / 1000));
      const m = Math.floor(secs / 60), s = secs % 60;
      els.sinceText.textContent = m > 0
        ? '마지막 탭 후 ' + m + '분 ' + s + '초 지났어요'
        : '마지막 탭 후 ' + s + '초 지났어요';
    }

    drawChart();
    renderBoard();
  }

  function drawChart() {
    const now = new Date();
    const hours = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getTime() - i * 3600 * 1000);
      hours.push({ hourLabel: d.getHours(), count: state.hourly[hourKey(d)] || 0 });
    }
    const max = Math.max(4, ...hours.map(h => h.count));
    const W = 320, H = 130, padL = 6, padR = 6, padT = 16, padB = 22;
    const bw = (W - padL - padR) / hours.length;
    const scaleY = (H - padT - padB) / max;

    let svg = '<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '" class="chart-axis"></line>';
    hours.forEach((h, i) => {
      const barW = bw * 0.6;
      const x = padL + i * bw + (bw - barW) / 2;
      const bh = h.count * scaleY;
      const y = H - padB - bh;
      svg += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="3" fill="var(--pink)"></rect>';
      if (h.count > 0) {
        svg += '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (y - 4).toFixed(1) + '" text-anchor="middle" class="chart-val">' + h.count + '</text>';
      }
      if (i % 2 === 0) {
        svg += '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" class="chart-label">' + h.hourLabel + '시</text>';
      }
    });
    els.chart.innerHTML = svg;
  }

  async function persist() {
    saveLocal();
    if (usingDb && docRef) {
      state.name = memberName;
      try { await docRef.set(state); } catch (e) {}
    }
  }

  function bounce() {
    els.tapBtn.classList.remove('bounce');
    void els.tapBtn.offsetWidth;
    els.tapBtn.classList.add('bounce');
  }

  function tap() {
    if (!memberId) return;
    const now = Date.now();
    state.recent.push(now);
    state.recent = state.recent.slice(-200);
    const key = hourKey(new Date(now));
    state.hourly[key] = (state.hourly[key] || 0) + 1;
    state.total += 1;
    render();
    bounce();
    persist();
  }

  function undo() {
    if (!state.recent.length) return;
    const last = state.recent.pop();
    const key = hourKey(new Date(last));
    if (state.hourly[key]) {
      state.hourly[key] -= 1;
      if (state.hourly[key] <= 0) delete state.hourly[key];
    }
    state.total = Math.max(0, state.total - 1);
    render();
    persist();
  }

  function activateMember() {
    els.nameGate.hidden = true;
    els.tapBtn.disabled = false;
    els.tapHint.textContent = '산만해질 때마다 당복이를 톡 눌러주세요';
    els.whoamiBtn.hidden = false;
    els.whoamiName.textContent = memberName;
    connectMemberDoc();
  }

  function setupNameGate() {
    els.nameSubmit.addEventListener('click', submitName);
    els.nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitName(); });
    els.whoamiBtn.addEventListener('click', () => {
      els.nameGate.hidden = false;
      els.nameInput.value = memberName || '';
      els.nameInput.focus();
    });
  }

  function submitName() {
    const v = els.nameInput.value.trim();
    if (!v) { els.nameInput.focus(); return; }
    memberName = v.slice(0, 12);
    localStorage.setItem(NAME_KEY, memberName);
    if (!memberId) {
      memberId = genId();
      localStorage.setItem(ID_KEY, memberId);
    }
    activateMember();
    render();
  }

  async function connectMemberDoc() {
    if (!usingDb || !membersCol || !memberId) return;
    docRef = membersCol.doc(memberId);
    try {
      const snap = await docRef.get();
      if (snap.exists) {
        const remote = pruneState(snap.data() || {});
        if (remote.total >= state.total) state = remote;
      }
      state.name = memberName;
      await docRef.set(state);
      render();
    } catch (e) {}
  }

  els.tapBtn.addEventListener('click', tap);
  els.undoBtn.addEventListener('click', undo);
  setupNameGate();

  memberId = localStorage.getItem(ID_KEY);
  memberName = localStorage.getItem(NAME_KEY);
  state = loadLocal();
  render();
  setInterval(render, 1000);

  if (memberId && memberName) {
    activateMember();
  } else {
    els.nameGate.hidden = false;
  }

  (async function initDb() {
    let db = null;
    try { db = window.claude ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (!db) return;
    usingDb = true;
    membersCol = db.collection('members');

    if (memberId && memberName) {
      connectMemberDoc();
    }

    try {
      membersCol.onSnapshot(function (snap) {
        const next = {};
        snap.docs.forEach(d => {
          if (d.id === memberId) return; // we render our own live state separately
          const data = d.data() || {};
          next[d.id] = pruneState(data);
        });
        members = next;
        renderBoard();
      }, function () { /* degrade silently, keep whatever we have */ });
    } catch (e) {}
  })();
})();
</script>
